name: Docker

# Every push to main and every pull request: build the image and smoke-test it.
# Every release tag (vX.Y.Z): also build for amd64 + arm64 (Raspberry Pi) and push to GHCR.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lucarne:test .

      - name: Start container
        run: |
          docker run -d --name lucarne -p 3001:3001 -e TZ=America/Chicago lucarne:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then echo; break; fi
            sleep 2
          done

      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:3001/api/health
          curl -fsS http://localhost:3001/ | grep -qi '<div id="root"' || { echo "Web app not served"; exit 1; }
          tz=$(docker exec lucarne node -e "console.log(Intl.DateTimeFormat().resolvedOptions().timeZone)")
          echo "Container time zone: $tz"
          [ "$tz" = "America/Chicago" ]
          docker exec lucarne test -f /app/data/lucarne.db
          docker exec lucarne touch /app/data/write-test
          status=$(docker inspect -f '{{.State.Health.Status}}' lucarne)
          echo "Health: $status"

      - name: Restart keeps data
        run: |
          docker restart lucarne
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/api/health && break; sleep 2; done
          docker exec lucarne test -f /app/data/write-test

      - name: Container logs
        if: always()
        run: docker logs lucarne

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lucarne"
          echo "list=$img:${GITHUB_REF_NAME#v},$img:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
